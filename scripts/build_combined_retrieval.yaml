# ---------------------------------------------------------------------------
# build_combined_retrieval.yaml — configuration for build_combined_retrieval.py
#
# Builds the retrieval caches for "combined" ablations: negatives generated by an
# alternative backbone AND retrieval enabled. The positives are shared with the
# baseline dataset, so their retrieval is recycled from `source_cache` and only the
# new negatives are retrieved.
#
# Run with:
#   python3 scripts/build_combined_retrieval.py --config scripts/build_combined_retrieval.yaml --dry-run
#   python3 scripts/build_combined_retrieval.py --config scripts/build_combined_retrieval.yaml
# ---------------------------------------------------------------------------

# Existing cache to recycle the positives from. Read-only; never modified.
# This is the cache the `pairwise-vanilla-ai_retrieval` ablation built.
source_cache: "output/iclr_test_instances/pairwise_data/20260517_171954/manipulated/retrieval_cache.json"

# Every cache this script produces lands under <output_root>/<label>/. The script
# refuses to touch a destination it did not create itself.
output_root: "output/iclr_test_instances/ablation/combined_retrieval"

# Retrieval settings for the negatives. Keep this a verbatim copy of
# `defaults.retrieval` in src/novelty_eval/ablation/ablations.yaml
# so the combined ablation stays comparable to the plain `retrieval` ablation.
retrieval:
  llm_engine: "claude-opus-4-6"
  cutoff_date: "2025-03-01"
  top_k_candidates: 5
  chunk_size: 10
  max_search_workers: 5
  use_semantic_scholar: false
  min_relevance_score: 0.8
  max_contributions: 3
  n_queries: 5
  # Not part of `defaults.retrieval`. Re-runs any cached idea that had >=1 query fail
  # or come back empty in a previous pass, so a transient search outage cannot leave an
  # idea permanently cached with 1-2 candidates instead of the intended 5.
  retry_failed_queries: true

datasets:
  - label: "gpt_5.1_backbone"
    pairwise: "output/iclr_test_instances/pairwise_data/20260531_131054/benchmark_instances.yaml"
    pointwise: "output/iclr_test_instances/pairwise_data/20260531_134638/iclr_pointwise_instances.yaml"

  - label: "gpt_5.4_backbone"
    pairwise: "output/iclr_test_instances/pairwise_data/20260531_130201/benchmark_instances.yaml"
    pointwise: "output/iclr_test_instances/pairwise_data/20260531_134819/iclr_pointwise_instances.yaml"

  - label: "opus-4-5_backbone"
    pairwise: "output/iclr_test_instances/pairwise_data/20260531_125138/benchmark_instances.yaml"
    pointwise: "output/iclr_test_instances/pairwise_data/20260531_134934/iclr_pointwise_instances.yaml"

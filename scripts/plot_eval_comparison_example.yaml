# Example config for plot_eval_comparison.py
#
# color_palette: list of hex colors assigned to models in first-appearance order.
# output_dir:    where PNGs are saved (default: current directory).

color_palette:
  - '#fce1ba'  # 1. Bright Peach-Cream (The Highlight)
  - '#e29578'  # 2. Muted Terra Cotta (Warm contrast to the purples)
  - '#b5838d'  # 3. Dusty Rose (Bridge)
  - '#8367c7'  # 4. Vivid Lavender (The "Pop" bar)
  - '#564e91'  # 5. Deep Indigo
  - '#2e2a5e'  # 6. Dark Navy
  - '#12102e'  # 7. Midnight Black (The Anchor)

output_dir: ./output/novelty_eval_benchmarking


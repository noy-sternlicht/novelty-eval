# Wording for the negatives-source figure (chart_negatives_source.py --config).
#
# Everything here is presentation only — it never changes a number. Keeping it in
# a file rather than argv means the paper's phrasing is version-controlled next to
# the figures it produces. Companion to two_track_figures.yaml.

# Rows, top to bottom: where the *negative* ideas came from.
#
# `source: baseline` takes the track's un-ablated numbers; `source: ablation`
# takes one panel's post-ablation numbers, with {setup} expanding to pointwise or
# pairwise. The track names must match the --track arguments.
#
# NOTE: the human row comes from a different merge, and therefore a different test
# set, than the generated rows below it. The figure cannot say so — the caption
# has to.
rows:
  - label: "Human"
    track: human
    source: baseline
  - label: "sonnet-4-5"
    track: generated
    source: baseline
  - label: "opus-4-5"
    track: generated
    source: ablation
    panel: "opus-4-5_backbone_{setup}_vanilla"
  - label: "gpt-5.1"
    track: generated
    source: ablation
    panel: "gpt_5.1_backbone_{setup}_vanilla"
  - label: "gpt-5.4"
    track: generated
    source: ablation
    panel: "gpt_5.4_backbone_{setup}_vanilla"

# Block titles. Each block also names its metric, since the two blocks score
# different things and the filename is the only other place that says which.
setup_labels:
  pointwise: "Pointwise"
  pairwise: "Pairwise"

# Metric key -> name in the block title. Without an entry the merge data's own
# label is used ("F1 macro", "Acc (with ties)", ...).
metric_labels:
  f1_macro: "Macro-F1"
  pairwise_accuracy: "Accuracy"

# Every cell prints its own number, so the colour scale is redundant encoding and
# the footnote repeats what the caption says. Both are off; the LaTeX caption has
# to carry the metric, that colour diverges around 50 (chance), and the differing
# test set behind the human row.
colorbar: false
footnote: ""

# What the two axes are. The same model names appear as negative-idea generators
# in the rows and as judges in the columns, so both need naming.
row_axis_label: "Negatives source"
col_axis_label: "Judge model"

# Judge column order, left to right. Default is whatever order the merge data
# lists; naming them here fixes it across regenerations and matches the ordering
# in the two-track ablation figures.
models:
  - claude-sonnet-4-5
  - claude-opus-4-5
  - claude-opus-4-6
  - gpt-5.1
  - gpt-5.2
  - gpt-5.4

# Column headers. The `claude-` prefix is dropped automatically; this is only for
# names the automatic rule cannot shorten.
model_labels: {}

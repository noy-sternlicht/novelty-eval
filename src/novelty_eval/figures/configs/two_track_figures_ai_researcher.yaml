# Wording for the AI-researcher prompt-variant figures (chart_two_track.py --config).
#
# Presentation only — nothing here changes a number.
#
# Tracks: merge_test_hvh.yaml (Human-only) and merge_test_vanilla_ai.yaml
# (Human + generated). Both merges set `baseline: ai_researcher_base`, so every
# row is the unmodified AI-researcher judge prompt with one thing changed, and
# the baseline strip reports that prompt's accuracy per judge.
#
# DIRECTION: unlike the main ablation figure, these rows are not "remove a
# capability" — they reword the judge prompt. A negative delta means the
# rewording made the judge worse at the task, so the caption should say the
# baseline is the unmodified AI-researcher prompt rather than the novelty judge.
row_labels:
  ai_researcher_no_review: "No review mention"
  ai_researcher_comparative: "Comparative language"

track_titles: {}

# Only pairwise data exists for these runs; the pointwise setup has nothing to
# draw and is skipped. The metric is not printed on the figure — it goes in the
# output filename, and the caption has to name it.
metrics:
  pairwise: pairwise_accuracy

metric_labels: {}

# Every cell prints its own numbers, so the colour scale is redundant encoding.
colorbar: false
footnote: ""

row_axis_label: "Prompt variant"
col_axis_label: "Judge model"

# Only these two judges ran the AI-researcher variants. Naming them here fixes
# the column order across regenerations.
models:
  - claude-opus-4-6
  - gpt-5.4

model_labels:
  claude-opus-4-6: "opus-4-6"

row_aliases: {}

rows:
  - ai_researcher_no_review
  - ai_researcher_comparative

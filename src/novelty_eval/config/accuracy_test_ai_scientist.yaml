# ---------------------------------------------------------------------------
# accuracy_test_ai_scientist.yaml — run the AI-Scientist novelty checker as a
# judge backend, scored through the same pointwise metrics path as every other
# judge so the numbers are directly comparable.
#
# Run with (NOT `python -m`, see the note at the bottom):
#
#   export PYTHONPATH=$PWD/src
#   export SECRETS=$PWD/secrets.toml
#   export OUTPUT_DIR=$PWD/output
#   ./myenv/bin/python src/novelty_eval/run_benchmark.py \
#       --config src/novelty_eval/config/accuracy_test_ai_scientist.yaml
#
# AI-Scientist does its OWN Semantic Scholar retrieval — it ignores
# retrieval_cache_file entirely, so none is set here. Each instance runs up to
# max_num_iterations rounds of: propose a query -> search S2 -> decide
# novel / not novel / search again.
# ---------------------------------------------------------------------------

# Pointwise instances (must carry `label`). Same file the other judges are scored on.

test_inputs: "data/human-plus-generated/pointwise.yaml" 

output_file: "accuracy_report.txt"

test_mode: "pointwise"

# Route the judge through baselines/registry.py instead of the in-house judge.
judge_backend: "baseline"
baseline: "ai_scientist"

# Passed verbatim to AIScientistRunner.run_pointwise.
#   max_num_iterations — upstream default is 10. Lowering it caps cost per instance,
#                        but rounds that run out without a verdict count as no
#                        prediction (injected as wrong), so it raises the failure rate.
#   use_retrieval      — feed the S2 results back into the next round's prompt.
#   resume_dir         — adapter-level, not passed to the runner. Point it at an
#                        interrupted run's artifacts dir (the parent of
#                        run_pointwise_0/) to replay instances that already
#                        reached a verdict instead of paying for them again:
#                          resume_dir: "output/accuracy_test_artifacts/2026-08-15_09-00-00"
baseline_kwargs:
  max_num_iterations: 10
  use_retrieval: true

# Number of runs (each writes its own run_pointwise_N/scores.json).
n: 1


num_instances: null


llm_engine: "claude-opus-4-6"
reasoning_effort: "high"

# Restricts what the baseline's own S2 searches may return, so a paper cannot
# retrieve itself or anything published after the benchmark's horizon.
# Matches the value used across the retrieval and web-search configs.
cutoff_date: "2025-03-01"

# Concurrency over instances. 
max_workers: 4

# Baselines are sync only 
use_batch_api: false

output_dir: "output"


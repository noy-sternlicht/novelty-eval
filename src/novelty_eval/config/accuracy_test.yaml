# ---------------------------------------------------------------------------
# accuracy_test.yaml — Configuration for accuracy_test.py
#
# Run with:
#   python -m novelty_eval.accuracy_test --config path/to/this/file.yaml
#
# Any value can be overridden from the command line, e.g.:
#   python -m novelty_eval.accuracy_test \
#       --config config/accuracy_test.yaml \
#       --llm-engine gpt-5.2
#
# Retrieval is pre-computed — supply a retrieval_cache_file to enable it.
# No online paper-search calls are made from this script.
# ---------------------------------------------------------------------------

# Path to the test instances YAML file (required)
test_inputs: "/Users/noysternlicht/myCode/Academic-Collabs/output/iclr_test_instances/pairwise_data/20260311_105604/iclr_test_instances.yaml"

# Name of the plain-text output report file (saved inside the timestamped artifact directory)
output_file: "accuracy_report.txt"

# Number of times to run each experiment mode
n: 1

# LLM engine to use for evaluation
llm_engine: "gpt-5.1"

# Reasoning effort passed to the model ("none" | "low" | "medium" | "high")
# "none" is OpenAI-only (disables reasoning); for Anthropic models it maps to the default ("high").
# "medium" is recommended as a fair cross-platform default.
reasoning_effort: "medium"

# Test mode:
#   "ranking"  — instances contain multiple ideas to rank.
#                Computes NDCG, MRR, MR, Hits@k, ranking accuracy.
#                Use the 'modes' field to choose tournament structures.
#   "pairwise" — instances are idea pairs.
#                Computes LLM pairwise accuracy only.
#                The 'modes' field is ignored.
test_mode: "pairwise"

# Tournament modes for ranking test_mode only (ignored in pairwise mode).
# Any subset of ["random", "rr", "swiss", "bi-swiss"]
modes:
  - random
  - swiss


# ---------------------------------------------------------------------------
# Concurrency
# ---------------------------------------------------------------------------
max_workers: 50

# ---------------------------------------------------------------------------
# Retrieval cache (pre-computed candidates)
# ---------------------------------------------------------------------------
# Leave unset (or null) to run without retrieval context.
# When set, retrieved candidates are read exclusively from this file —
# no online search calls are made.
# retrieval_cache_file: "src/novelty_eval/benchmark_data/iclr_test_instances/20260221_094500/raw_abstract/retrieval_cache.json"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output_dir: "/Users/noysternlicht/myCode/Academic-Collabs/output/accuracy_test_artifacts"

# ---------------------------------------------------------------------------
# Instance filtering
# ---------------------------------------------------------------------------

# Set to a positive integer to limit how many test instances are processed.
# Comment out (or set to null) to process all instances.
num_instances: 12

# ---------------------------------------------------------------------------
# MEC (Multiple Evidence Calibration) + BPC (Balanced Position Calibration)
# ---------------------------------------------------------------------------
# Number of forward + reverse call pairs per match (Wang et al., FairEval ACL 2024).
# mec_k=1 → 1 fwd + 1 rev = identical result to the original bidirectional aggregation.
# mec_k=3 → 3 fwd + 3 rev = 6 calls per pair, reduces position bias.
mec_k: 3

# ---------------------------------------------------------------------------
# Batch API
# ---------------------------------------------------------------------------
use_batch_api: false

# ---------------------------------------------------------------------------
# Reprocess mode
# ---------------------------------------------------------------------------
# Provide the path to a previously-generated artifact directory to skip
# re-running the LLM and only regenerate reports from saved scores.
# update_report: null


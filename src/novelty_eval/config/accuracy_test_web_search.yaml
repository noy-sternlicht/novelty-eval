# ---------------------------------------------------------------------------
# accuracy_test_web_search.yaml — Smoke-test config for the web_search judge backend.
#
# Uses the OpenAI Responses API with a web_search tool restricted to arxiv.org.
# The model searches ArXiv live during each comparison instead of relying on a
# pre-built retrieval cache.
#
# Run with:
#   python -m novelty_eval.run_benchmark \
#       --config src/novelty_eval/config/accuracy_test_web_search.yaml
# ---------------------------------------------------------------------------

test_inputs: "output/iclr_test_instances/pairwise_data/20260518_133102/iclr_pointwise_instances.yaml"

output_file: "accuracy_report.txt"

n: 1


llm_engine: "gpt-5.5-pro"

reasoning_effort: "medium"

test_mode: "pointwise"

# ---------------------------------------------------------------------------
# Web search judge backend
# ---------------------------------------------------------------------------
judge_backend: "web_search"

# Papers published after this date will be excluded from the model's web searches.
# Set to the submission deadline of the evaluated venue.
cutoff_date: "2025-03-01"

# ---------------------------------------------------------------------------
# Concurrency — keep low; each call triggers live web searches
# ---------------------------------------------------------------------------
max_workers: 1

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output_dir: "output/accuracy_test_artifacts"

# Small slice for a quick smoke test; remove (or set to null) for a full run
num_instances: 1

# ---------------------------------------------------------------------------
# MEC / BPC
# ---------------------------------------------------------------------------
mec_k: 1

use_batch_api: true

# ===========================================================================
# Ablation Study Configuration
# ===========================================================================
# This file is the single source of truth for all ablation experiments.
#
# SCHEMA STRUCTURE:
# -----------------
# 1. shared:   YAML anchors for repeated strings (criteria, prompt paths).
# 2. defaults: Global base settings for 'instance' creation and 'sweep' execution.
# 3. tracks:   Track-specific baselines (e.g., 'pairwise', 'ranking'). These
#              inherit from defaults and define the track's anchor configuration.
# 4. ablations: Individual experiment definitions.
#
# HOW TO DEFINE AN ABLATION:
# --------------------------
# Each ablation entry can specify:
#   description:  Text used in reports and logs.
#   tracks:       List of tracks to run this ablation on (e.g., [pairwise, ranking]).
#                 The orchestrator automatically expands these into namespaced
#                 experiments: '{track}_{name}'.
#   inherit_from: Optional list of other ablations to merge settings from.
#                 Settings are merged recursively: Base -> Parent(s) -> Current.
#   instance:     Overrides for create_benchmark_instances.py.
#                 - Use a dictionary for specific overrides.
#                 - Use a string (e.g. "plan_format") to reuse instances from
#                   another experiment in the same track.
#                 - Use null to reuse the track baseline instances.
#   sweep:        Overrides for run_accuracy_sweep.py.
#                 - Use test_inputs: "__PLACEHOLDER__" if this ablation creates
#                   its own instances.
#   preprocess:   Optional ('strip_eval') to modify instances before the sweep.
#   retrieve:     Optional (true) to trigger related work retrieval.
#   openai_only:  Optional (true) to skip non-OpenAI models for this experiment.
#   significance_alternative: Optional ("two-sided" | "less" | "greater").
#     Controls the `alternative` parameter for scipy.stats.bootstrap (default: "two-sided").
#     Use "less" when the ablation is expected to perform *worse* than baseline
#     (significant if CI high < 0); use "greater" when expected to *outperform*
#     (significant if CI low > 0).
#
# ===========================================================================

# ---------------------------------------------------------------------------
# Shared Constants (YAML Anchors)
# ---------------------------------------------------------------------------
shared:
  # Paths to Jinja2 templates
  templates:
    remove_eval_data: &remove_eval_data "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/templates/remove_eval_data.jinja2"
    extract_research_plan: &extract_plan "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/templates/extract_research_plan.jinja2"
    extract_plan_verbatim: &extract_plan_verbatim "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/templates/extract_idea_summary.jinja2"
    boring_idea_generation: &boring_idea_generation "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/templates/boring_idea_generation.jinja2"

  vague_novelty_criterion: &vague_criterion |
    The substantive originality of the idea, characterized by:
    - The introduction of new frameworks, concepts, evaluations, resources or approaches absent from existing knowledge.
    - The non-trivial synthesis of existing frameworks, concepts, evaluations, resources or approaches.
    - The extension of established frameworks, concepts, evaluations, resources or approaches into previously unexplored problem domains.
# ---------------------------------------------------------------------------
# Global Defaults
# ---------------------------------------------------------------------------
defaults:
  instance:
    iclr_data:
      - "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/iclr_data/20260313_161835/iclr_2026_clean_novelty_dataset_10_percent.json"
    num_top_papers: 1
    num_bottom_papers: 1
    model_name: "claude-opus-4-6"
    manipulation_prompt: *remove_eval_data
    use_abstract_only: false
    generate_both_versions: false
    max_workers: 50
    mix_topics: false
    strictness: "majority"
    generate_negatives: true
    max_instances: null
    md_report_batch_size: 20
    min_pos_rating: 6.0
    max_pos_rating: null
    min_neg_rating: null
    max_neg_rating: 3.5
    min_pos_contribution: 3.0
    max_pos_contribution: null
    min_neg_contribution: null
    max_neg_contribution: 2.0
    pipeline_config:
      author_selection:
        retrieve_specific_authors: false
        team_size: 2
        use_seed_author: false
        min_papers_per_expert: 2
        embedding_batch_size: 1024
        max_papers_retrieved: 10
        encoder_model: "lightonai/Reason-ModernColBERT"
        keyword_engine: "gpt-5.2"
      author_representation:
        backbone_model: "claude-sonnet-4-5"
        model_provider: "anthropic"
        architecture: "simple"
        use_tools: false
        tools: ["own_papers_search"]
      brainstorming:
        max_turns: 2
        divergence_protocol: "round-robin-abstract"
        convergence_protocol: "random"
        explicit_tool_instructions: false
        include_citations_in_response: false

  retrieval:
    llm_engine: "claude-opus-4-6"
    cutoff_date: '2025-03-01'
    top_k_candidates: 5
    chunk_size: 10
    max_search_workers: 10
    use_semantic_scholar: false
    min_relevance_score: 0.8
    max_contributions: 3
    n_queries: 5

  sweep:
    n_runs: 1
    max_workers: 100
    anthropic_max_workers: 10
    output_dir: "."
    output_file: "accuracy_report.txt"
    retrieve_related_work: false
    use_batch_api: false
    reasoning_effort: "high"
    mec_k: 3
    use_prompt_caching: true
    # Default configs - can be overridden
    configs:
      - name: "gpt-5.2"
        llm_engine: "gpt-5.2"

# ---------------------------------------------------------------------------
# Track Baselines
# ---------------------------------------------------------------------------
tracks:
  pairwise:
    instance:
      num_bottom_papers: 1
    sweep:
      test_mode: "pairwise"
      test_inputs: "output/iclr_test_instances/pairwise_data/20260318_155708/manipulated/iclr_test_instances.yaml"

  pairwise-vanilla-ai:
    instance:
      num_bottom_papers: 1
    sweep:
      test_mode: "pairwise"
      test_inputs: "output/iclr_test_instances/pairwise_data/20260517_171954/manipulated/iclr_test_instances.yaml"

  pairwise-vanilla-ai-plan:
    instance:
      num_bottom_papers: 1
    sweep:
      test_mode: "pairwise"
      test_inputs: "output/iclr_test_instances/pairwise_data/20260517_171954/manipulated/manually-manipulated/iclr_test_instances.yaml"

  pairwise-hvh:
    instance:
      num_bottom_papers: 1
    sweep:
      test_mode: "pairwise"
      test_inputs: "output/iclr_test_instances/pairwise_data/20260429_221238/manipulated/iclr_test_instances.yaml"

  pairwise-hvh-plan:
    instance:
      num_bottom_papers: 1
    sweep:
      test_mode: "pairwise"
      test_inputs: "output/iclr_test_instances/pairwise_data/20260429_221238/manipulated/manually-manipulated/iclr_test_instances.yaml"

  ranking:
    instance:
      num_bottom_papers: 3
    sweep:
      test_mode: "ranking"
      modes: ["swiss"]
      test_inputs: "output/iclr_test_instances/ablation/c4/20260319_190917/iclr_test_instances.yaml"

  pointwise:
    instance:
      derive_pointwise_from_track: "pairwise"
    sweep:
      test_mode: "pointwise"
      test_inputs: "output/iclr_test_instances/ablation/pointwise_current/20260430_100138/iclr_pointwise_instances.yaml"

  pointwise-hvh:
    instance:
      derive_pointwise_from_track: "pairwise-hvh"
    sweep:
      test_mode: "pointwise"
      test_inputs: "output/iclr_test_instances/ablation/pointwise-hvh_current/20260501_123408/iclr_pointwise_instances.yaml"

  pointwise-vanilla-ai:
    instance:
      num_bottom_papers: 1
    sweep:
      test_mode: "pointwise"
      test_inputs: "output/iclr_test_instances/pairwise_data/20260518_133102/iclr_pointwise_instances.yaml"

  old_data:
    instance: null  # Reuse existing instances for old data
    sweep:
      test_inputs: "output/iclr_vs_generated_test_instances/20260305_154230/test_instances.yaml"
      test_mode: "ranking"
      modes: ["swiss"]

# ---------------------------------------------------------------------------
# Ablations
# ---------------------------------------------------------------------------
# Many ablations apply to both 'pairwise' and 'ranking' tracks.
# run_ablations.py automatically generates '{track}_{name}' for the requested tracks.
ablations:
  # --- Baseline ---
  current:
    description: "Current"
    group: baseline
    legacy_names: [c4, "20260320_133004"]   # c4 = old name for the 4-way ranking baseline
    tracks: [pairwise, ranking, pointwise, pairwise-hvh, pointwise-hvh, pairwise-vanilla-ai, pointwise-vanilla-ai]


  # --- Evaluation methodology ablations ---
  vague_criterion:
    description: "Vague novelty criterion"
    before_description: "A more specific novelty criterion with concrete guidance."
    group: evaluation
    legacy_names: [c1]
    tracks: [pairwise, ranking, pointwise, pairwise-hvh, pointwise-hvh, pairwise-vanilla-ai, pointwise-vanilla-ai]

    sweep:
      novelty_criterion_override: *vague_criterion

  unidirectional:
    description: "Unidirectional (fwd-only, no position debiasing)"
    before_description: "Bidirectional evaluation (+ three samples per direction) to reduce position bias."
    group: evaluation
    legacy_names: [c5a]
    tracks: [pairwise, ranking, pairwise-hvh, pairwise-vanilla-ai]
    sweep:
      n_runs: 3
      mec_k: 1
      bidirectional: false

  mec_k_1:
    description: "Bidirectional evaluation evaluation with mec_k=1 (single sample per direction)"
    before_description: "Bidirectional evaluation with mec_k=3 (three samples per direction) to reduce position bias."
    group: evaluation
    legacy_names: [c5b]
    tracks: [pairwise, ranking, pointwise, pairwise-hvh, pointwise-hvh, pairwise-vanilla-ai, pointwise-vanilla-ai]
    sweep:
      mec_k: 1
      bidirectional: true

  low_judge_reasoning:
    description: "Judge's reasoning_effort=low"
    before_description: "Judge's reasoning_effort='high'"
    group: evaluation
    legacy_names: []
    tracks: [pairwise, ranking, pointwise, pairwise-hvh, pointwise-hvh, pairwise-vanilla-ai, pointwise-vanilla-ai]
    sweep:
      reasoning_effort: "low"

  no_criteria_prompt:
    description: "Simplified judge prompt (no evaluation criteria)"
    before_description: "Full judge prompt with detailed evaluation criteria."
    group: evaluation
    legacy_names: []
    tracks: [pairwise, ranking, pointwise, pairwise-hvh, pointwise-hvh, pairwise-vanilla-ai, pointwise-vanilla-ai]
    sweep:
      pairwise_judge_template: "pairwise_novelty_no_criteria.jinja2"
      pointwise_judge_template: "pointwise_novelty_no_criteria.jinja2"


  low_judge_reasoning_unidirectional:

# ---------------------------------------------------------------------------
# Combined ablations: an alternative backbone generates the negatives AND the
# judge gets related work. Presented next to each single-factor change so the
# combination can be read against them.
#
# Run with:
#   python3 src/novelty_eval/ablation/merge_ablation_runs.py \
#       --config src/novelty_eval/ablation/configs/merge/merge_config_combined.yaml
#
# No `baseline:` key, so every ablation is compared to the track's `current`
# run. Each combined delta therefore reflects BOTH changes at once; read it
# against the two single-factor panels rather than on its own.
# ---------------------------------------------------------------------------

dirs:
  # --- baselines (`current`), needed for any delta to be computed ---
  - output/ablation_sweeps/20260518_110534 # pairwise baseline (partial)
  - output/ablation_sweeps/20260518_200746 # pairwise baseline (completion)
  - output/ablation_sweeps/20260528_171320 # pointwise baseline

  # --- single-factor: alternative backbone, no retrieval ---
  - output/ablation_sweeps/20260531_132457 # gpt-5.1 backbone (pairwise)
  - output/ablation_sweeps/20260531_144925 # gpt-5.1 backbone (pointwise)
  - output/ablation_sweeps/20260531_135654 # gpt-5.4 backbone (pairwise)
  - output/ablation_sweeps/20260531_151912 # gpt-5.4 backbone (pointwise)
  - output/ablation_sweeps/20260531_143138 # opus-4-5 backbone (pairwise)
  - output/ablation_sweeps/20260531_153715 # opus-4-5 backbone (pointwise)

  # --- single-factor: retrieval, baseline negatives ---
  - output/ablation_sweeps/20260623_110753 # retrieval (pairwise)
  - output/ablation_sweeps/20260623_112217 # retrieval (pointwise)

  # --- combined: backbone + retrieval ---
  - output/ablation_sweeps/20260810_100339 # gpt-5.1 + retrieval (pairwise)
  - output/ablation_sweeps/20260810_101025 # gpt-5.1 + retrieval (pointwise)
  - output/ablation_sweeps/20260810_174004 # gpt-5.4 + retrieval (pairwise)
  - output/ablation_sweeps/20260810_173736 # gpt-5.4 + retrieval (pointwise)
  - output/ablation_sweeps/20260811_102919 # opus-4-5 + retrieval (pairwise)
  - output/ablation_sweeps/20260811_103311 # opus-4-5 + retrieval (pointwise)

output_dir: output/ablation_sweeps/merge_combined
report_name: combined_ablations.md

metrics:
  pairwise:
    - pairwise_accuracy
    - pairwise_accuracy_strict
  pointwise:
    - f1_macro
    - f1_pos
    - f1_neg

exclude_models:
  - gpt-5.2
  - gpt-5.1
  - claude-sonnet-4-5
  - claude-opus-4-5

# Panels are ordered so each combined result sits directly after the two
# single-factor changes it is made of.
unified_chart:
  - name: gpt_5.1_backbone_pairwise_vanilla
    title: "GPT-5.1 Backbone"
  - name: retrieval
    title: "Retrieval"
  - name: gpt_5.1_backbone_retrieval_pairwise_vanilla
    title: "GPT-5.1 Backbone + Retrieval"
  - name: gpt_5.4_backbone_pairwise_vanilla
    title: "GPT-5.4 Backbone"
  - name: gpt_5.4_backbone_retrieval_pairwise_vanilla
    title: "GPT-5.4 Backbone + Retrieval"
  - name: opus-4-5_backbone_pairwise_vanilla
    title: "Opus-4-5 Backbone"
  - name: opus-4-5_backbone_retrieval_pairwise_vanilla
    title: "Opus-4-5 Backbone + Retrieval"
  - name: gpt_5.1_backbone_pointwise_vanilla
    title: "GPT-5.1 Backbone"
  - name: gpt_5.1_backbone_retrieval_pointwise_vanilla
    title: "GPT-5.1 Backbone + Retrieval"
  - name: gpt_5.4_backbone_pointwise_vanilla
    title: "GPT-5.4 Backbone"
  - name: gpt_5.4_backbone_retrieval_pointwise_vanilla
    title: "GPT-5.4 Backbone + Retrieval"
  - name: opus-4-5_backbone_pointwise_vanilla
    title: "Opus-4-5 Backbone"
  - name: opus-4-5_backbone_retrieval_pointwise_vanilla
    title: "Opus-4-5 Backbone + Retrieval"

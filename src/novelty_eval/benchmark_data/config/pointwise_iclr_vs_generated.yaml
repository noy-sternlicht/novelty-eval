# Configuration for create_benchmark_instances.py — pointwise mode
#
# In pointwise mode each output instance contains exactly ONE idea with an
# absolute POSITIVE or NEGATIVE label, enabling absolute quality scoring
# rather than relative pairwise ranking.

# ── Input ────────────────────────────────────────────────────────────────────
iclr_data:
  - "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/iclr_data/20260313_161835/iclr_2026_clean_novelty_dataset_10_percent.json"

# ── Output ───────────────────────────────────────────────────────────────────
output_dir: "/Users/noysternlicht/myCode/Academic-Collabs/output/iclr_test_instances/pointwise_data"

# ── Pointwise mode ────────────────────────────────────────────────────────────
# Enable pointwise mode (one idea per instance with a POSITIVE/NEGATIVE label).
pointwise: true

# Enforce a 1:1 positive:negative ratio by truncating the larger set.
pointwise_balance: true

# Shuffle the final instance list before saving (recommended to avoid ordering bias).
pointwise_shuffle: true

# ── Abstract manipulation ─────────────────────────────────────────────────────
# Model used to manipulate abstracts. Set to null to use raw abstracts.
model_name: claude-opus-4-6

# Path to the Jinja2 manipulation template. null → default (extract_research_plan).
manipulation_prompt: "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/templates/remove_eval_data.jinja2"

# Use only the original abstract, bypassing manipulation entirely.
use_abstract_only: false

# Maximum number of parallel worker threads for LLM calls.
max_workers: 50

# ── Topic mixing ─────────────────────────────────────────────────────────────
# Pool papers from all areas before instance creation (not recommended for pointwise
# since area is stored per-instance anyway).
mix_topics: false

# ── Strict novelty-signal filtering ──────────────────────────────────────────
# null | "majority" | "all" — controls reviewer agreement required for inclusion.
strictness: majority

# ── Instance limit ───────────────────────────────────────────────────────────
# Maximum total instances (after balance + shuffle). null = no limit.
max_instances: null


# ── Markdown report batching ──────────────────────────────────────────────────
# Split the markdown report into multiple numbered files (e.g. _001.md, _002.md)
# so large datasets remain renderable in IDEs.
# Set to null to write a single file.
md_report_batch_size: 20

# ── Rating filters ───────────────────────────────────────────────────────────
min_pos_rating: 6.0
max_pos_rating: null
min_neg_rating: null
max_neg_rating: 3.5

# ── Contribution-score filters ────────────────────────────────────────────────
min_pos_contribution: 3.0
max_pos_contribution: null
min_neg_contribution: null
max_neg_contribution: 2.0

# ── Unused in pointwise mode (kept for config parity) ────────────────────────
num_top_papers: 1
num_bottom_papers: 1
generate_both_versions: false

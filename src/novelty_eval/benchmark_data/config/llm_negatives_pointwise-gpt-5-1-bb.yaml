# Configuration for create_benchmark_instances.py

# ── Input ────────────────────────────────────────────────────────────────────
# Paths to the clean novelty dataset JSON files (list of one or more paths).
iclr_data:
  #  - "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/iclr_data/20260219_150254/iclr_2026_clean_novelty_dataset_10_percent.json"
  - "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/iclr_data/20260313_161835/iclr_2026_clean_novelty_dataset_10_percent.json"

# ── Instance composition ─────────────────────────────────────────────────────
# Number of top (positive / accepted) papers per test instance.
num_top_papers: 1

# Number of bottom (negative / rejected) papers per test instance.
num_bottom_papers: 1

# ── Output ───────────────────────────────────────────────────────────────────
# Base directory where timestamped output sub-folders will be created.
output_dir: "/Users/noysternlicht/myCode/Academic-Collabs/output/iclr_test_instances/pairwise_data"

# ── Abstract manipulation ─────────────────────────────────────────────────────
# Model used to manipulate abstracts before creating instances.
# Set to null to skip manipulation and use raw abstracts instead.
model_name: claude-opus-4-6

# Path to the Jinja2 template used to prompt the LLM when manipulating abstracts.
# The template receives a single variable: {{ abstract }}.
# Set to null to use the default (templates/extract_research_plan.jinja2).
# Example: "templates/remove_eval_data.jinja2"
manipulation_prompt: "/Users/noysternlicht/myCode/Academic-Collabs/src/comparative_idea_quality_eval/benchmark_data/templates/remove_eval_data.jinja2"
derive_pointwise_from_pairwise: "output/iclr_test_instances/pairwise_data/20260531_131054/benchmark_instances.yaml"


#pre_built_manipulation_cache_yaml: "output/iclr_test_instances/pairwise_data/20260318_155708/manipulated/iclr_test_instances.yaml"

# Use only the original abstract, bypassing any abstract manipulation.
# Cannot be combined with generate_both_versions: true.
use_abstract_only: false

# Generate two correlated dataset versions: one with raw abstracts and one
# with manipulated abstracts.  Requires model_name to be set.
# Cannot be combined with use_abstract_only: true.
generate_both_versions: true

# Maximum number of parallel worker threads for LLM calls.
max_workers: 10

# ── Topic mixing ─────────────────────────────────────────────────────────────
# When true, papers from all research areas are pooled before creating
# instances instead of being kept per-topic.
mix_topics: false

# ── Strict novelty-signal filtering ──────────────────────────────────────────
# Controls how many reviewers must agree on the novelty signal direction before
# a paper is included in the dataset.
#
#   null       – no filtering (include all papers regardless of reviewer agreement)
#   "majority" – more than half of reviewers must agree on the signal direction
#                (positive signals for top papers, negative signals for bottom papers)
#   "all"      – every reviewer must agree on the signal direction
#
strictness: majority

# ── Generated negatives ──────────────────────────────────────────────────────
# When true, negative (bottom) papers are *not* drawn from the ICLR dataset.
# Instead, the pipeline (author selection → author representation →
# brainstorming) is invoked for each research area to produce synthetic
# abstracts that serve as negatives.
# Requires pipeline_config to be filled in below.
generate_negatives: false
llm_negatives: true
llm_negatives_model: "claude-sonnet-4-5"
llm_negatives_prompt: "src/novelty_eval/benchmark_data/templates/idea_generation_3.jinja2"

# Pipeline configuration used when generate_negatives is true.
# These mirror the [author_selection], [author_representation], and
# [brainstorming] sections from the main pipeline TOML config.
# Set to null when generate_negatives is false.
pipeline_config:
  author_selection:
    retrieve_specific_authors: false
    team_size: 2
    use_seed_author: false
    min_papers_per_expert: 2
    embedding_batch_size: 1024
    max_papers_retrieved: 10
    encoder_model: "lightonai/Reason-ModernColBERT"
    keyword_engine: "gpt-5.2"

  author_representation:
    backbone_model: "claude-sonnet-4-5"
    model_provider: "anthropic"   # options: "openai" | "anthropic"
    architecture: "simple"
    use_tools: false
    tools:
      - "own_papers_search"

  brainstorming:
    max_turns: 2
    divergence_protocol: "round-robin-abstract"
    convergence_protocol: "random"
    explicit_tool_instructions: false
    include_citations_in_response: false
# ── Instance limit ───────────────────────────────────────────────────────────
# Maximum number of test instances to generate. Useful for quick smoke tests.
# Set to null to generate all available instances.
max_instances: null

# ── Markdown report batching ──────────────────────────────────────────────────
# Split the markdown report into multiple numbered files (e.g. _001.md, _002.md)
# so large datasets remain renderable in IDEs.
# Set to null to write a single file.
md_report_batch_size: 20

# ── Rating filters ───────────────────────────────────────────────────────────
# Leave as null to disable a filter.
min_pos_rating: 6.0       # Minimum average rating for positive (top) papers.
max_pos_rating: null       # Maximum average rating for positive (top) papers.
min_neg_rating: null       # Minimum average rating for negative (bottom) papers.
max_neg_rating: 3.5       # Maximum average rating for negative (bottom) papers.

# ── Contribution-score filters ────────────────────────────────────────────────
# Leave as null to disable a filter.
min_pos_contribution: 3.0  # Minimum average contribution score for positive papers.
max_pos_contribution: null  # Maximum average contribution score for positive papers.
min_neg_contribution: null  # Minimum average contribution score for negative papers.
max_neg_contribution: 2.0  # Maximum average contribution score for negative papers.

